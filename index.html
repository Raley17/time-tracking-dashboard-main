<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="src/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <script defer src="src/main.js"></script>

    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    <main>
      <div class="mainBox">
        <div class="profile">
          <img src="./images/image-jeremy.png" alt="User PP" width="56px" />
          <p class="name">Report for <span>Jeremy Robson</span></p>
        </div>
        <nav>
          <a href="#" class="">Daily</a>
          <a href="#" class="focused">Weekly</a>
          <a href="#" class="">Monthly</a>
        </nav>
      </div>

      <div class="inGrid">
        <div class="box" data-title="Work">
          <div class="inbox">
            <div class="firstRow">
              <p>Work</p>
              <img
                src="./images/icon-ellipsis.svg"
                alt="Ellipsis SVG"
                width="17px"
              />
            </div>
            <div class="secondRow">
              <p class="hour"></p>
              <p class="previous"></p>
            </div>
          </div>
        </div>
        <div class="box play" data-title="Play">
          <div class="inbox">
            <div class="firstRow">
              <p>Play</p>
              <img
                src="./images/icon-ellipsis.svg"
                alt="Ellipsis SVG"
                width="17px"
              />
            </div>
            <div class="secondRow active">
              <p class="hour"></p>
              <p class="previous"></p>
            </div>
          </div>
        </div>
        <div class="box study" data-title="Study">
          <div class="inbox">
            <div class="firstRow">
              <p>Study</p>
              <img
                src="./images/icon-ellipsis.svg"
                alt="Ellipsis SVG"
                width="17px"
              />
            </div>
            <div class="secondRow">
              <p class="hour"></p>
              <p class="previous"></p>
            </div>
          </div>
        </div>
        <div class="box exercise" data-title="Exercise">
          <div class="inbox">
            <div class="firstRow">
              <p>Exercise</p>
              <img
                src="./images/icon-ellipsis.svg"
                alt="Ellipsis SVG"
                width="17px"
              />
            </div>
            <div class="secondRow">
              <p class="hour"></p>
              <p class="previous"></p>
            </div>
          </div>
        </div>
        <div class="box social" data-title="Social">
          <div class="inbox">
            <div class="firstRow">
              <p>Social</p>
              <img
                src="./images/icon-ellipsis.svg"
                alt="Ellipsis SVG"
                width="17px"
              />
            </div>
            <div class="secondRow">
              <p class="hour"></p>
              <p class="previous"></p>
            </div>
          </div>
        </div>
        <div class="box selfcare" data-title="Self Care">
          <div class="inbox">
            <div class="firstRow">
              <p>Self Care</p>
              <img
                src="./images/icon-ellipsis.svg"
                alt="Ellipsis SVG"
                width="17px"
              />
            </div>
            <div class="secondRow">
              <p class="hour"></p>
              <p class="previous"></p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://www.frontendmentor.io/profile/Raley17">Raley17</a>.
    </footer>
  </body>
</html>
